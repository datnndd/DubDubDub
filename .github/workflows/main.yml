name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Test and build React frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' | sort)
          for ((i = 0; i < ${#files[@]}; i += 4)); do
            echo "Running test files $((i + 1))-$((i + 4)) of ${#files[@]}"
            timeout --signal=TERM --kill-after=10s 300s uv run --frozen pytest -q -x --disable-warnings --timeout=120 --timeout-method=signal -o faulthandler_timeout=90 "${files[@]:i:4}"
          done
