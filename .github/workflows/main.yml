name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Test and build React frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mapfile -t files < <(find tests -type f -name 'test_*.py' | sort)
          uv run --frozen pytest -vv -x --timeout=60 --timeout-method=signal "${files[@]:24:8}"
          for ((i = 0; i < ${#files[@]}; i += 8)); do
            if ((i == 24)); then continue; fi
            echo "Running test files $((i + 1))-$((i + 8)) of ${#files[@]}"
            uv run --frozen pytest -q -x --disable-warnings --timeout=180 --timeout-method=thread -o faulthandler_timeout=120 "${files[@]:i:8}"
          done
