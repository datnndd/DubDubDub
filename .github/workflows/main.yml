name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Test and build React frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          PYTHONUNBUFFERED: "1"
        run: uv run --frozen pytest -vv -x --timeout=180 --timeout-method=thread -o faulthandler_timeout=120
